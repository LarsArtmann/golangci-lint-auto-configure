# golangci-lint v1 configuration with all deprecated properties
# This file tests migration of all deprecated properties to v2.x format

version: "1"

run:
  timeout: 5m
  tests: true
  skip-dirs:
    - vendor
    - third_party
  skip-dirs-use-default: true
  issues:
    exclude-use-default: true
    exclude-rules-use-default: true
    exclude-dir-use-default: true
    exclude-rules:
      - path: _test\.go
        linters:
          - dupl
      - path: internal/
        linters:
          - gosec
    exclude-files:
      - "*_generated.go"
      - "*.pb.go"
    exclude-dirs:
      - .git
      - .idea

output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
  sort-results: true

linters:
  enable:
    - gofmt
    - goimports
    - golint
    - vet
    - errcheck
    - staticcheck
  disable:
    - gosimple
    - unused
  enable-all: false
  fast: false

linters-settings:
  gofmt:
    goimports:
      local-prefixes: github.com/myorg/mypackage
  golint:
    min-confidence: 0.8
  errcheck:
    check-type-assertions: true
    check-blank: true
  staticcheck:
    checks: ["all"]
  goimports:
    local-prefixes: github.com/myorg/mypackage

# Deprecated linters-settings that should be migrated to linters.settings
linters-settings-deprecated:
  dupl:
    threshold: 100
  goconst:
    min-len: 3
    min-occurrences: 3
  misspell:
    locale: US
  lll:
    line-length: 120
  unused:
    checks: ["all"]
  unconvert:
    acute: false
  gocyclo:
    min-complexity: 10
