# Already migrated v2 configuration (should be a no-op)
version: "2"
run:
  timeout: 5m
  issues:
    exclude:
      rules:
        - path: _test\.go
          linters:
            - dupl
      dirs:
        - .git
linters:
  enable:
    - gofmt
    - errcheck
  settings:
    errcheck:
      check-type-assertions: true
