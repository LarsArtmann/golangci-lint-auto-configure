# GoReleaser configuration
# Documentation: https://goreleaser.com

version: 2

project_name: golangci-lint-auto-configure

before:
  hooks:
    - go mod tidy

builds:
  - id: golangci-lint-auto-configure
    main: ./cmd/golangci-lint-auto-configure
    binary: golangci-lint-auto-configure
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: darwin
        goarch: 386
      - goos: windows
        goarch: arm64
    tags:
      - netgo
      - osusergo
    ldflags:
      - -s -w
      - -X github.com/larsartmann/golangci-lint-auto-configure/pkg/version.version={{.Version}}
      - -X github.com/larsartmann/golangci-lint-auto-configure/pkg/version.commit={{.Commit}}
      - -X github.com/larsartmann/golangci-lint-auto-configure/pkg/version.date={{.Date}}
      - -X github.com/larsartmann/golangci-lint-auto-configure/pkg/version.treeState=clean

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{- title .Os }}_{{- if eq .Arch "amd64" }}x86_64
        {{- else if eq .Arch "386" }}i386
        {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE*
      - README*
      - CHANGELOG*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  groups:
    - title: "Features"
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: "Bug Fixes"
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: "Other"
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--oidc-issuer=https://token.actions.githubusercontent.com"
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
    artifacts: all
    output: true

sboms:
  - artifacts: archive

homebrew_casks:
  - name: golangci-lint-auto-configure
    skip_upload: true
    homepage: "https://github.com/LarsArtmann/golangci-lint-auto-configure"
    description: "Auto-configure golangci-lint for Go projects"
    repository:
      owner: LarsArtmann
      name: homebrew-tap
    directory: Casks
    commit_author:
      name: goreleaserbot
      email: goreleaser@larsartmann.com
    binaries:
      - golangci-lint-auto-configure
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/golangci-lint-auto-configure"]
          end

nix:
  - name: golangci-lint-auto-configure
    skip_upload: auto
    repository:
      owner: LarsArtmann
      name: nur-packages
    homepage: "https://github.com/LarsArtmann/golangci-lint-auto-configure"
    description: "Auto-configure golangci-lint for Go projects"
    license: mit
    formatter: nixfmt
    path: pkgs/golangci-lint-auto-configure/default.nix
    install: |
      mkdir -p $out/bin
      cp -vr ./golangci-lint-auto-configure $out/bin/golangci-lint-auto-configure

nfpms:
  - id: default
    package_name: golangci-lint-auto-configure
    file_name_template: "{{ .ConventionalFileName }}"
    homepage: "https://github.com/LarsArtmann/golangci-lint-auto-configure"
    description: "Auto-configure golangci-lint for Go projects"
    license: MIT
    maintainer: "Lars Artmann <lars@larsartmann.com>"
    formats:
      - deb
      - rpm
      - apk
    contents:
      - src: LICENSE
        dst: /usr/share/doc/golangci-lint-auto-configure/LICENSE
      - src: README.md
        dst: /usr/share/doc/golangci-lint-auto-configure/README.md

scoops:
  - name: golangci-lint-auto-configure
    skip_upload: true
    repository:
      owner: LarsArtmann
      name: homebrew-tap
    directory: Scoop
    commit_author:
      name: goreleaserbot
      email: goreleaser@larsartmann.com
    homepage: "https://github.com/LarsArtmann/golangci-lint-auto-configure"
    description: "Auto-configure golangci-lint for Go projects"
    license: MIT

dockers_v2:
  - images:
      - "ghcr.io/larsartmann/golangci-lint-auto-configure"
    tags:
      - "{{ .Tag }}"
      - latest
    dockerfile: Dockerfile.goreleaser
    labels:
      "org.opencontainers.image.created": "{{.Date}}"
      "org.opencontainers.image.title": "{{.ProjectName}}"
      "org.opencontainers.image.revision": "{{.FullCommit}}"
      "org.opencontainers.image.version": "{{.Version}}"
      "org.opencontainers.image.source": "{{.GitURL}}"

release:
  github:
    owner: LarsArtmann
    name: golangci-lint-auto-configure
  draft: false
  prerelease: auto
  name_template: "golangci-lint-auto-configure v{{.Version}}"
  footer: |
    ## Installation

    **Homebrew:**
    ```bash
    brew tap LarsArtmann/tap
    brew install --cask golangci-lint-auto-configure
    ```

    **Nix:**
    ```bash
    nix run github:LarsArtmann/nur-packages#golangci-lint-auto-configure
    ```

    **Linux (.deb):**
    Download the .deb from the assets below.

    **Windows (Scoop):**
    ```bash
    scoop bucket add LarsArtmann https://github.com/LarsArtmann/homebrew-tap
    scoop install golangci-lint-auto-configure
    ```
