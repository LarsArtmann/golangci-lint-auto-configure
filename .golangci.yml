version: "2"
run:
    timeout: 10m
    go: ""
    build-tags: []
    allow-parallel-runners: false
    allow-serial-runners: false
    tests: true
output:
    formats: {}
linters:
    enable:
        - dupword
        - nilnesserr
        - durationcheck
        - ireturn
        - dogsled
        - wrapcheck
        - errcheck
        - maintidx
        - errorlint
        - asasalint
        - iface
        - tagliatelle
        - goheader
        - reassign
        - prealloc
        - unqueryvet
        - gocheckcompilerdirectives
        - arangolint
        - gocyclo
        - mirror
        - bidichk
        - rowserrcheck
        - iotamixing
        - canonicalheader
        - tagalign
        - nestif
        - goprintffuncname
        - mnd
        - whitespace
        - makezero
        - promlinter
        - zerologlint
        - thelper
        - testifylint
        - usestdlibvars
        - sqlclosecheck
        - unused
        - exhaustive
        - bodyclose
        - paralleltest
        - gosmopolitan
        - depguard
        - godox
        - errname
        - predeclared
        - nosprintfhostport
        - contextcheck
        - testpackage
        - usetesting
        - gochecknoglobals
        - unparam
        - govet
        - gomodguard
        - dupl
        - asciicheck
        - nilnil
        - wastedassign
        - gocritic
        - gomoddirectives
        - recvcheck
        - nlreturn
        - funlen
        - cyclop
        - varnamelen
        - intrange
        - gosec
        - perfsprint
        - staticcheck
        - containedctx
        - godoclint
        - importas
        - ineffassign
        - err113
        - protogetter
        - noinlineerr
        - forbidigo
        - ginkgolinter
        - nakedret
        - embeddedstructfieldcheck
        - misspell
        - gocognit
        - exptostd
        - forcetypeassert
        - spancheck
        - godot
        - gochecksumtype
        - wsl_v5
        - goconst
        - revive
        - grouper
        - funcorder
        - nonamedreturns
        - copyloopvar
        - tparallel
        - testableexamples
        - decorder
        - fatcontext
        - unconvert
        - gochecknoinits
        - modernize
        - interfacebloat
        - inamedparam
        - nolintlint
        - exhaustruct
    settings:
        cyclop:
            max-complexity: 15
        funlen:
            lines: 80
            statements: 50
        gocognit:
            min-complexity: 25
        gocyclo:
            min-complexity: 20
formatters:
    enable:
        - golines
    settings:
        golines:
            max-len: 120
issues:
    max-issues-per-linter: 100
    max-same-issues: 15
