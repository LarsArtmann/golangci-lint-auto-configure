version: "2"
run:
  timeout: 10m
  go: ""
  build-tags: []
  allow-parallel-runners: false
  allow-serial-runners: false
  tests: true
output:
  formats: {}
linters:
  enable:
    - errcheck
    - gosec
    - govet
    - staticcheck
    - ineffassign
    - gocritic
    - unused
    - gocyclo
    - funlen
    - cyclop
    - gocognit
    - nestif
    - maintidx
    - dupl
    - goconst
    - misspell
    - nolintlint
    - godot
    - godox
  settings:
    cyclop:
      max-complexity: 15
    funlen:
      lines: 80
      statements: 50
    gocognit:
      min-complexity: 25
    gocyclo:
      min-complexity: 20
formatters:
  enable:
    - golines
  settings:
    golines:
      max-len: 120
issues:
  max-issues-per-linter: 100
  max-same-issues: 15
