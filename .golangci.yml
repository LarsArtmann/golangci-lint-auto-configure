# golangci-lint configuration for this project
# Uses v2.8+ schema with explicit linter enablement
version: "2"

run:
  timeout: 10m
  tests: true

linters:
  enable:
    # Critical security and correctness linters
    - errcheck
    - gosec
    - govet
    - staticcheck
    - ineffassign
    - nilerr
    - noctx
    - sloglint
    - loggercheck
    - musttag
    - errchkjson

    # High value quality linters
    - errorlint
    - exhaustive
    - forcetypeassert
    - goconst
    - gocyclo
    - funlen
    - misspell
    - prealloc
    - revive
    - unconvert
    - wrapcheck

    # Medium value linters
    - cyclop
    - gocognit
    - maintidx
    - nolintlint
    - varnamelen

  settings:
    gocyclo:
      min-complexity: 20
    funlen:
      lines: 80
      statements: 50
    gocognit:
      min-complexity: 25

issues:
  max-issues-per-linter: 100
  max-same-issues: 15
  new: false