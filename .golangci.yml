# golangci-lint configuration file for golangci-linter-auto-configure
version: "2"

run:
  timeout: 5m
  issues-exit-code: 1
  tests: true
  skip-dirs:
    - vendor

formatters:
  enable:
    - gofmt
    - goimports
    - gofumpt
    - gci
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/larsartmann/golangcli-linter-auto-configure

linters:
  default: none
  enable:
    # Error handling
    - errcheck
    - errorlint
    
    # Code quality
    - staticcheck
    - gosimple
    - unused
    - ineffassign
    
    # Security
    - gosec
    
    # Complexity
    - gocyclo
    - funlen
    - gocognit
    - maintidx
    
    # Style
    - revive
    - misspell
    - whitespace
    
    # Performance/Optimization
    - prealloc
    - unconvert
    - unparam
