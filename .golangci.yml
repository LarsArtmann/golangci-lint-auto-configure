version: "2"
run:
  timeout: 10m
  go: ""
  build-tags: []
  allow-parallel-runners: false
  allow-serial-runners: false
  tests: true
output:
  formats: {}
linters:
  enable:
    - errcheck
    - gosec
    - govet
    - staticcheck
    - ineffassign
    - nilerr
    - noctx
    - sloglint
    - loggercheck
    - musttag
    - errchkjson
    - errorlint
    - exhaustive
    - forcetypeassert
    - goconst
    - gocyclo
    - funlen
    - misspell
    - prealloc
    - revive
    - unconvert
    - wrapcheck
    - cyclop
    - gocognit
    - maintidx
    - nolintlint
    - varnamelen
    - arangolint
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    - decorder
    - depguard
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - errname
    - exhaustruct
    - exptostd
    - forbidigo
    - funcorder
    - fatcontext
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocritic
    - godoclint
    - godot
    - godox
    - err113
    - goheader
    - mnd
    - modernize
    - gomoddirectives
    - gomodguard
    - goprintffuncname
    - gosmopolitan
    - grouper
    - iface
    - importas
    - inamedparam
    - interfacebloat
    - intrange
    - iotamixing
    - ireturn
    - lll
    - makezero
    - mirror
    - nakedret
    - nestif
    - nilnesserr
    - nilnil
    - nlreturn
    - noinlineerr
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - recvcheck
    - rowserrcheck
    - sqlclosecheck
    - spancheck
    - tagalign
    - tagliatelle
    - testableexamples
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unparam
    - unqueryvet
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
    - wsl
    - wsl_v5
    - zerologlint
  settings:
    funlen:
      lines: 80
      statements: 50
    gocognit:
      min-complexity: 25
    gocyclo:
      min-complexity: 20
issues:
  max-issues-per-linter: 100
  max-same-issues: 15
