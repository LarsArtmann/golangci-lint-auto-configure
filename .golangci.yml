version: "2"
run:
  timeout: 10m
  go: ""
  build-tags: []
  allow-parallel-runners: false
  allow-serial-runners: false
  tests: true
output:
  formats: {}
linters:
  enable:
    - testpackage
    - musttag
    - goheader
    - gocheckcompilerdirectives
    - arangolint
    - perfsprint
    - containedctx
    - sloglint
    - nilnesserr
    - whitespace
    - promlinter
    - varnamelen
    - godoclint
    - copyloopvar
    - testableexamples
    - nilerr
    - noctx
    - unqueryvet
    - gocyclo
    - makezero
    - cyclop
    - ineffassign
    - inamedparam
    - asasalint
    - usestdlibvars
    - exhaustive
    - paralleltest
    - gomodguard
    - gocritic
    - thelper
    - bodyclose
    - predeclared
    - funlen
    - grouper
    - maintidx
    - tagliatelle
    - unused
    - wastedassign
    - staticcheck
    - importas
    - protogetter
    - misspell
    - tagalign
    - unparam
    - recvcheck
    - noinlineerr
    - gocognit
    - forcetypeassert
    - tparallel
    - bidichk
    - iotamixing
    - errname
    - asciicheck
    - nlreturn
    - ireturn
    - mirror
    - canonicalheader
    - mnd
    - gochecknoglobals
    - nakedret
    - godox
    - nosprintfhostport
    - loggercheck
    - nestif
    - goprintffuncname
    - exptostd
    - decorder
    - modernize
    - errchkjson
    - dogsled
    - errorlint
    - reassign
    - prealloc
    - zerologlint
    - depguard
    - err113
    - dupl
    - gochecksumtype
    - wsl_v5
    - revive
    - nonamedreturns
    - durationcheck
    - wrapcheck
    - contextcheck
    - gomoddirectives
    - intrange
    - ginkgolinter
    - embeddedstructfieldcheck
    - spancheck
    - sqlclosecheck
    - usetesting
    - nilnil
    - funcorder
    - unconvert
    - interfacebloat
    - exhaustruct
    - dupword
    - errcheck
    - iface
    - gosmopolitan
    - govet
    - forbidigo
    - fatcontext
    - gochecknoinits
    - rowserrcheck
    - testifylint
    - gosec
    - godot
    - goconst
    - nolintlint
  settings:
    cyclop:
      max-complexity: 15
    depguard:
      rules:
        Main:
          allow:
            - $gostd
            - github.com/charmbracelet
            - charm.land/log/v2
            - charm.land/lipgloss/v2
            - github.com/larsartmann/golangcli-linter-auto-configure
            - github.com/LarsArtmann/universal-workflow
            - github.com/spf13/cobra
            - github.com/spf13/afero
            - github.com/stretchr/testify
            - gopkg.in/yaml.v3
            - golang.org/x/mod/semver
            - github.com/samber/mo
            - github.com/a-h/templ
            - github.com/go-playground/validator/v10
            - github.com/pelletier/go-toml/v2
          files:
            - "!**/*_test.go"
    exhaustruct:
      exclude:
        - .*\.Test.*
        - .*Test.*
        - charm.land/log.Options
        - github.com/larsartmann/golangcli-linter-auto-configure/pkg/types.*
    funlen:
      lines: 80
      statements: 50
    gocognit:
      min-complexity: 25
    gocyclo:
      min-complexity: 20
    tagliatelle:
      case:
        rules:
          json: snake
          yaml: kebab
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - exhaustruct
          - err113
          - wrapcheck
      - path: internal/cli|examples/|cmd/
        linters:
          - depguard
      - path: _test\.go
        linters:
          - gosec
      - path: pkg/types/types\.go
        linters:
          - tagliatelle
      - path: pkg/errors/errors\.go
        linters:
          - funcorder
      - path: pkg/workflow/workflow\.go
        linters:
          - containedctx
      - path: internal/cli/|pkg/workflow/workflow\.go|examples/|pkg/client/client\.go
        linters:
          - exhaustruct
      - path: pkg/constants/
        linters:
          - gochecknoglobals
      - path: pkg/types/validation\.go
        linters:
          - gochecknoglobals
      - path: pkg/detection/patterns\.go
        linters:
          - gochecknoglobals
      - path: go\.mod
        linters:
          - gomoddirectives
      - path: pkg/diff/differ\.go
        linters:
          - funcorder
      - path: pkg/workflow/workflow\.go
        linters:
          - gocognit
      - path: pkg/linter/fixer\.go
        linters:
          - gocognit
      - path: pkg/types/types\.go
        linters:
          - tagalign
      - path: pkg/config/loader\.go
        linters:
          - wrapcheck
          - noinlineerr
      - path: pkg/linter/analyzer\.go
        linters:
          - wrapcheck
          - noinlineerr
      - path: pkg/linter/fixer\.go
        linters:
          - wrapcheck
          - noinlineerr
      - path: pkg/linter/version_checker\.go
        linters:
          - tagliatelle
          - wrapcheck
      - path: pkg/report/json_report_generator\.go
        linters:
          - tagliatelle
      - path: internal/cli/cmd/
        linters:
          - gocognit
      - path: internal/cli/cmd_migrate\.go
        linters:
          - gocognit
      - path: pkg/detection/detector\.go
        linters:
          - godox
      - path: pkg/linter/fixer\.go
        linters:
          - gocyclo
          - nestif
      - path: pkg/linter/fixer\.go|internal/cli/cmd_configure\.go|pkg/linter/analyzer\.go|internal/cli/cmd/installhook\.go
        linters:
          - noinlineerr
      - path: pkg/constants/linter_reasons\.go
        linters:
          - gosec
      - path: pkg/linter/command_runner\.go|pkg/linter/version_checker\.go
        linters:
          - gosec
      - path: internal/cli/cmd/installhook\.go
        linters:
          - gosec
          - funlen
      - path: internal/cli/cmd/migrate\.go
        linters:
          - funlen
      - path: internal/cli/cmd_validate\.go
        linters:
          - funlen
      - path: pkg/detection/detector_test\.go
        linters:
          - funlen
          - paralleltest
      - path: pkg/diff/differ_test\.go
        linters:
          - funlen
          - paralleltest
      - path: pkg/workflow/workflow\.go
        linters:
          - ireturn
      - path: _test\.go
        linters:
          - paralleltest
      - path: pkg/report/json_report_generator\.go
        linters:
          - gosec
      - path: internal/cli/commands\.go
        linters:
          - gochecknoglobals
      - path: pkg/config/loader\.go
        linters:
          - godox
      - path: pkg/linter/fixer\.go
        linters:
          - godox
      - path: pkg/types/types\.go
        linters:
          - godox
      - path: internal/cli/commands_test\.go
        linters:
          - goconst
      - path: pkg/linter/version_checker\.go
        linters:
          - noinlineerr
      - path: _test\.go
        linters:
          - revive
      - path: pkg/types/validation\.go
        linters:
          - revive
      - path: pkg/types/
        linters:
          - revive
        text: "var-naming: avoid meaningless package names"
      - path: pkg/linter/fixer\.go
        linters:
          - cyclop
      - path: internal/cli/cmd/installhook\.go|pkg/report/json_report_generator\.go
        linters:
          - mnd
      - path: pkg/linter/fixer\.go
        linters:
          - funlen
          - maintidx
      - path: pkg/report/json_report_generator\.go
        linters:
          - noinlineerr
formatters:
  enable:
    - golines
  settings:
    golines:
      max-len: 120
issues:
  max-issues-per-linter: 100
  max-same-issues: 15
