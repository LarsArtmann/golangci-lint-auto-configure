version: "2"
run:
  timeout: 10m
  go: ""
  build-tags: []
  allow-parallel-runners: false
  allow-serial-runners: false
  tests: true
output:
  formats: {}
linters:
  enable:
    - dupword
    - errchkjson
    - loggercheck
    - musttag
    - nilerr
    - noctx
    - sloglint
    - lll
    - nilnesserr
    - durationcheck
    - ireturn
    - dogsled
    - wrapcheck
    - errcheck
    - maintidx
    - errorlint
    - asasalint
    - iface
    - tagliatelle
    - goheader
    - reassign
    - prealloc
    - unqueryvet
    - gocheckcompilerdirectives
    - arangolint
    - gocyclo
    - mirror
    - bidichk
    - rowserrcheck
    - iotamixing
    - canonicalheader
    - tagalign
    - nestif
    - goprintffuncname
    - mnd
    - whitespace
    - makezero
    - promlinter
    - zerologlint
    - thelper
    - testifylint
    - usestdlibvars
    - sqlclosecheck
    - unused
    - exhaustive
    - bodyclose
    - paralleltest
    - gosmopolitan
    - depguard
    - godox
    - errname
    - predeclared
    - nosprintfhostport
    - contextcheck
    - testpackage
    - usetesting
    - gochecknoglobals
    - unparam
    - govet
    - gomodguard
    - dupl
    - asciicheck
    - nilnil
    - wastedassign
    - gocritic
    - gomoddirectives
    - recvcheck
    - nlreturn
    - funlen
    - cyclop
    - varnamelen
    - intrange
    - gosec
    - perfsprint
    - staticcheck
    - containedctx
    - godoclint
    - importas
    - ineffassign
    - err113
    - protogetter
    - noinlineerr
    - forbidigo
    - ginkgolinter
    - nakedret
    - embeddedstructfieldcheck
    - misspell
    - gocognit
    - exptostd
    - forcetypeassert
    - spancheck
    - godot
    - gochecksumtype
    - wsl_v5
    - goconst
    - revive
    - grouper
    - funcorder
    - nonamedreturns
    - copyloopvar
    - tparallel
    - testableexamples
    - decorder
    - fatcontext
    - unconvert
    - gochecknoinits
    - modernize
    - interfacebloat
    - inamedparam
    - nolintlint
    - exhaustruct
  settings:
    cyclop:
      max-complexity: 15
    funlen:
      lines: 80
      statements: 50
    gocognit:
      min-complexity: 25
    gocyclo:
      min-complexity: 20
    exhaustruct:
      exclude:
        - '.*\.Test.*'
        - ".*Test.*"
        - "github.com/charmbracelet/log.Options"
        - "github.com/larsartmann/golangcli-linter-auto-configure/pkg/types.*"
    tagliatelle:
      case:
        rules:
          json: snake
          yaml: kebab
    depguard:
      rules:
        Main:
          files:
            - "!**/*_test.go"
          allow:
            - $gostd
            - github.com/charmbracelet
            - github.com/larsartmann/golangcli-linter-auto-configure
            - github.com/LarsArtmann/universal-workflow
            - github.com/spf13/cobra
            - github.com/stretchr/testify
            - gopkg.in/yaml.v3
            - golang.org/x/mod/semver
            - github.com/samber/mo
            - github.com/a-h/templ
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - exhaustruct
          - err113
          - wrapcheck
        path: _test\.go
      - linters:
          - depguard
        path: "internal/cli|examples/|cmd/"
      - linters:
          - gosec
        path: _test\.go
      - linters:
          - tagliatelle
        path: 'pkg/types/types\.go'
      - linters:
          - containedctx
        path: 'pkg/workflow/workflow\.go'
formatters:
  enable:
    - golines
  settings:
    golines:
      max-len: 120
issues:
  max-issues-per-linter: 100
  max-same-issues: 15
