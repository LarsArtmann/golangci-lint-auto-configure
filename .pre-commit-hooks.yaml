# Pre-commit hooks for golangci-linter-auto-configure
# Install: Copy to .pre-commit-hooks.yaml in your project root
# Usage: https://pre-commit.com/

- id: golangci-linter-configure
  name: Auto-configure golangci-lint
  description: Runs golangci-linter-auto-configure to ensure optimal linter settings
  entry: golangci-linter-auto-configure configure --priority high
  language: system
  pass_filenames: false
  always_run: true
  stages: [pre-commit]

- id: golangci-linter-run
  name: Run golangci-lint
  description: Runs golangci-lint on changed Go files
  entry: golangci-lint run --colored-output=true
  language: system
  pass_filenames: true
  types: [go]
  stages: [pre-commit]

- id: go-test
  name: Run Go tests
  description: Runs go test on changed packages
  entry: go test -short ./...
  language: system
  pass_filenames: false
  types: [go]
  stages: [pre-commit]

- id: go-fmt
  name: Format Go code
  description: Formats Go code with gofmt
  entry: gofmt -d -e
  language: system
  pass_filenames: true
  types: [go]
  stages: [pre-commit]

- id: go-mod-tidy
  name: Tidy go.mod
  description: Ensures go.mod is tidy
  entry: go mod tidy
  language: system
  pass_filenames: false
  stages: [pre-push]
