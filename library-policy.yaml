# Library Policy Configuration
# This file documents intentional exceptions to the library policy

version: "1"

# Ignored violations with explanations
ignore:
  # Project already uses github.com/charmbracelet/fang v1.0.0 (see go.mod line 9)
  # The cobra_companion rule is a false positive - fang is already integrated
  - rule: cobra_companion
    reason: "Project already uses charmbracelet/fang v1.0.0 - see go.mod line 9"

  # encoding/json/v2 requires GOEXPERIMENT=jsonv2 which is not suitable for CLI tools
  # Users would need to set environment variables to run the tool
  - rule: encoding_json_v2_replacement
    reason: "Requires GOEXPERIMENT=jsonv2 build flag - not suitable for CLI tools that users run without special environment"

  # These are DETECTION patterns for analyzing OTHER projects, not actual usage
  - rule: echo_framework
    reason: "Detection pattern in pkg/detection/patterns.go - used to detect frameworks in OTHER projects"
  - rule: gofiber
    reason: "Detection pattern in pkg/detection/patterns.go - used to detect frameworks in OTHER projects"
  - rule: gorilla_mux
    reason: "Detection pattern in pkg/detection/patterns.go - used to detect frameworks in OTHER projects"
  - rule: fasthttp
    reason: "Detection pattern in pkg/detection/patterns.go - used to detect frameworks in OTHER projects"
  - rule: go_chi
    reason: "Detection pattern in pkg/detection/patterns.go - used to detect frameworks in OTHER projects"
  - rule: urfave_cli
    reason: "Detection pattern in pkg/detection/patterns.go - used to detect frameworks in OTHER projects"

  # Project already uses charm.land/lipgloss/v2 (see go.mod line 6)
  # The charmbracelet_lipgloss_v1 rule is a false positive from detection patterns
  - rule: charmbracelet_lipgloss_v1
    reason: "Detection pattern false positive - project uses lipgloss v2 (go.mod line 6)"

  # This is just a string describing a linter, not actual testify usage
  # See pkg/constants/linter_reasons.go line 57: "testifylint": "Checks usage of..."
  - rule: testify
    file: "pkg/constants/linter_reasons.go"
    reason: "False positive - this is a string describing the testifylint linter, not actual testify usage"

  # govalid package doesn't exist as a standalone library
  # go-playground/validator is stable, widely used, and actively maintained
  - rule: go_playground_validator
    reason: "Recommended alternative 'govalid' doesn't exist as standalone package; go-playground/validator is stable and widely used"
