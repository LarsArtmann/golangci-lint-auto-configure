# Standard golangci-lint configuration
# Use case: Most projects, balanced linting
# Note: Run `golangci-lint-auto-configure configure` for automatic optimization

version: "2"

run:
  timeout: 5m
  issues-exit-code: 1
  tests: true

linters:
  enable:
    # Critical (from minimal)
    - gosec
    - errcheck
    - staticcheck
    - govet
    - errchkjson
    - nilerr
    - noctx
    - sloglint
    - loggercheck
    - musttag

    # High value quality linters
    - wrapcheck
    - errorlint
    - prealloc
    - unconvert
    - ineffassign
    - gocyclo
    - funlen
    - cyclop
    - gocognit
    - maintidx
    - exhaustive
    - goconst
    - misspell
    - revive
    - nolintlint
    - forcetypeassert

  settings:
    gocyclo:
      min-complexity: 20
    funlen:
      lines: 80
      statements: 50
    gocognit:
      min-complexity: 25

  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - exhaustruct
          - testpackage
          - gochecknoglobals
          - funlen
          - cyclop
          - goconst
      - path: _test\.go
        text: unused
        linters:
          - unused
    paths:
      - _templ\.go$
      - .gen\.go$
      - vendor/

formatters:
  exclusions:
    generated: lax
    paths:
      - _templ\.go$

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
