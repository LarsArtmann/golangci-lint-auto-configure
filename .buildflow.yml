# BuildFlow Configuration
# See: https://github.com/larsartmann/buildflow

build_mode: full

max_concurrency: 4

max_file_size: 350 # lines
dupl_threshold: 30 # tokens

todo_min_severity: info

exclude:
  - vendor
  - .git
  - node_modules
  - .next
  - .turbo
  - .nuxt
  - .svelte-kit
  - dist
  - target
  - testdata
  - .golden
  - generated.go
  - "*.pb.go"
  - "*.gen.go"
  - _templ.go
  - __snapshots__
  - reports/
  - flake.lock
  - package-lock.json
  - yarn.lock
  - pnpm-lock.yaml
  - Cargo.lock
  - composer.lock
  - poetry.lock
  - Gemfile.lock
  - mix.lock
  - .direnv

# REMOVED 2026-09-17: skip entry `nixfmt-standalone` referenced a tool name that
# no longer exists (the provider is now `nix-fmt`, which respects excludes).

auto_fix: false

verbose: false
log_level: info
