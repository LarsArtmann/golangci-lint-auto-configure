# Backfill a GHCR image for an already-published release tag.
#
# Use when a release's docker stage failed (e.g. the pre-v0.8.1 buildx
# failures) but the tag itself is fine: rebuilds the linux binaries exactly
# as .goreleaser.yaml does and pushes a multi-arch image for the given tag.
#
# Deliberately does NOT push the `latest` tag — that always belongs to the
# newest release; backfilling an older one must not regress it.
name: Backfill GHCR Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build the image for (e.g. v0.8.0)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  GOEXPERIMENT: jsonv2
  REGISTRY_IMAGE: ghcr.io/larsartmann/golangci-lint-auto-configure
  TAG: ${{ inputs.tag }}

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Build linux binaries (goreleaser-equivalent)
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          COMMIT="$(git rev-parse HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w \
            -X github.com/larsartmann/golangci-lint-auto-configure/pkg/version.version=${VERSION} \
            -X github.com/larsartmann/golangci-lint-auto-configure/pkg/version.commit=${COMMIT} \
            -X github.com/larsartmann/golangci-lint-auto-configure/pkg/version.date=${DATE} \
            -X github.com/larsartmann/golangci-lint-auto-configure/pkg/version.treeState=clean"
          for arch in amd64 arm64; do
            mkdir -p "dist/linux/${arch}"
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" \
              go build -tags "netgo osusergo" -ldflags "${LDFLAGS}" \
              -o "dist/linux/${arch}/golangci-lint-auto-configure" ./cmd/golangci-lint-auto-configure
          done

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        working-directory: dist
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          COMMIT="$(git rev-parse HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file "${GITHUB_WORKSPACE}/Dockerfile.goreleaser" \
            --tag "${REGISTRY_IMAGE}:${TAG}" \
            --label "org.opencontainers.image.created=${DATE}" \
            --label "org.opencontainers.image.title=golangci-lint-auto-configure" \
            --label "org.opencontainers.image.revision=${COMMIT}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --push \
            .

      - name: Verify image
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${REGISTRY_IMAGE}:${TAG}"
          docker run --rm --platform linux/amd64 \
            --entrypoint golangci-lint-auto-configure "${REGISTRY_IMAGE}:${TAG}" --version
