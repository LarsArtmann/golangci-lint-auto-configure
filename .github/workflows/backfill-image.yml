# Backfill a GHCR image for an already-published release tag.
#
# Use when a release's docker stage failed (e.g. the pre-v0.8.1 buildx
# failures) but the tag itself is fine: rebuilds the linux binaries exactly
# as .goreleaser.yaml does and pushes a multi-arch image for the given tag.
#
# Deliberately does NOT push the `latest` tag — that always belongs to the
# newest release; backfilling an older one must not regress it.
name: Backfill GHCR Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build the image for (e.g. v0.8.0)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  GOEXPERIMENT: jsonv2
  REGISTRY_IMAGE: ghcr.io/larsartmann/golangci-lint-auto-configure

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Build linux binaries (goreleaser-equivalent)
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          COMMIT="$(git rev-parse HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w \
            -X github.com/larsartmann/golangci-lint-auto-configure/pkg/version.version=${VERSION} \
            -X github.com/larsartmann/golangci-lint-auto-configure/pkg/version.commit=${COMMIT} \
            -X github.com/larsartmann/golangci-lint-auto-configure/pkg/version.date=${DATE} \
            -X github.com/larsartmann/golangci-lint-auto-configure/pkg/version.treeState=clean"
          for arch in amd64 arm64; do
            mkdir -p "dist/linux/${arch}"
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" \
              go build -tags "netgo osusergo" -ldflags "${LDFLAGS}" \
              -o "dist/linux/${arch}/golangci-lint-auto-configure" ./cmd/golangci-lint-auto-configure
          done

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        working-directory: dist
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          COMMIT="$(git rev-parse HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file "${GITHUB_WORKSPACE}/Dockerfile.goreleaser" \
            --tag "${REGISTRY_IMAGE}:${GITHUB_REF_NAME}" \
            --label "org.opencontainers.image.created=${DATE}" \
            --label "org.opencontainers.image.title=golangci-lint-auto-configure" \
            --label "org.opencontainers.image.revision=${COMMIT}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --push \
            .

      - name: Verify image
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${REGISTRY_IMAGE}:${GITHUB_REF_NAME}"
          docker run --rm --platform linux/amd64 "${REGISTRY_IMAGE}:${GITHUB_REF_NAME}" --version
