# Backfill signatures and SBOMs for an already-published release.
#
# Use when a release shipped without them (the v0.11.0 case: its release run
# died at the signing stage after publishing every artifact). Downloads all
# release assets, generates a Syft SBOM per archive/package the way
# GoReleaser would, signs every asset (including the new SBOMs) with cosign
# v3 keyless bundle signing — the exact command shape .goreleaser.yaml uses —
# and uploads everything back to the release.
#
# Re-running is safe: SBOMs and bundles are regenerated deterministically and
# uploaded with --clobber.
name: Backfill Release Signatures

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to sign (e.g. v0.11.0)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

env:
  TAG: ${{ inputs.tag }}

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Install Cosign
        # Latest cosign v3: matches .goreleaser.yaml's bundle signing.
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" \
            --dir assets --clobber
          ls -la assets/

      - name: Generate SBOMs for archives and packages
        working-directory: assets
        run: |
          # Same shape as GoReleaser's sboms pipe: one SPDX JSON next to each
          # archive/package. The checksums file and bare assets get none.
          shopt -s nullglob
          for artifact in *.tar.gz *.zip *.deb *.rpm *.apk; do
            syft "${artifact}" --file "${artifact}.sbom.json"
          done
          ls -la *.sbom.json

      - name: Sign all assets (cosign v3 bundles)
        working-directory: assets
        env:
          COSIGN_YES: "true"
        run: |
          # Exact argument shape of .goreleaser.yaml's signs pipe (keyless,
          # bundle output, no service URLs — v3 fetches them from the TUF
          # signing config).
          for artifact in *; do
            case "${artifact}" in
              *.sigstore.json) continue ;;
            esac
            cosign sign-blob --bundle "${artifact}.sigstore.json" "${artifact}"
          done
          ls -la *.sigstore.json | head -20

      - name: Verify a sample bundle before uploading
        working-directory: assets
        env:
          COSIGN_YES: "true"
        run: |
          cosign verify-blob \
            --bundle "checksums.txt.sigstore.json" \
            --certificate-identity-regexp \
            "^https://github.com/LarsArtmann/golangci-lint-auto-configure/\.github/workflows/backfill-signing\.yml@${GITHUB_REF}$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            checksums.txt

      - name: Upload signatures and SBOMs to the release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: assets
        run: |
          gh release upload "${TAG}" *.sigstore.json *.sbom.json \
            --repo "${GITHUB_REPOSITORY}" --clobber

      - name: Summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" \
            --json assets --jq '[.assets[] | select(.name | endswith(".sigstore.json") or endswith(".sbom.json"))] | length')
          echo "Release ${TAG} now carries ${count} signature/SBOM assets." >> "$GITHUB_STEP_SUMMARY"
