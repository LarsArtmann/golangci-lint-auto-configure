name: Go CI/CD

on:
  push:
    branches: [master, main, develop]
    paths-ignore:
      - "**/*.md"
      - docs/**
      - LICENSE
      - .gitignore
      - "**/*.svg"
      - "**/*.png"
  pull_request:
    branches: [master, main, develop]
    paths-ignore:
      - "**/*.md"
      - docs/**
      - LICENSE
      - .gitignore
      - "**/*.svg"
      - "**/*.png"

permissions:
  contents: read
  pull-requests: read

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
      CGO_ENABLED: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Cache Go modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-test-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-test-
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: go mod download

      - name: Build verification
        run: |
          go build -v ./...
          echo "✓ Build successful"

      - name: Run tests
        run: go test -v -race ./pkg/... ./internal/...

      - name: Test with coverage
        run: |
          go test -v -coverprofile=coverage.out -covermode=atomic ./pkg/... ./internal/...
          echo "Coverage per package:"
          go test ./pkg/... ./internal/... -cover 2>&1 | grep coverage:
          echo ""
          echo "Overall coverage:"
          go tool cover -func=coverage.out | grep total | awk '{print "  " $3 " of statements covered"}'

      - name: Coverage threshold gate
        run: go run ./cmd/coverage-check -min=60 -profile=coverage.out

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45 # v5
        with:
          file: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true

    timeout-minutes: 15
  lint:
    name: Lint with golangci-lint
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Cache Go modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-lint-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-lint-
            ${{ runner.os }}-go-

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@db9de0fc1a667e1a49d2291a1a042dff081d78f6 # v9
        with:
          version: v2.12.2
          args: --config=.golangci.yml --timeout=5m
          working-directory: .
          skip-cache: false
          skip-save-cache: false

      - name: Build verification (lint job)
        run: |
          go build -v ./...
          echo "✓ Build verification successful"

    timeout-minutes: 15
  nix:
    name: Nix Flake Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41 # main

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@55718cd9ebf1737a061487d5ada21abf31e99a98 # main

      - name: Check flake.lock is up to date
        run: |
          nix flake lock
          if git diff --exit-code flake.lock; then
            echo "✓ flake.lock is up to date"
          else
            echo "✗ flake.lock is stale — run 'nix flake lock' locally and commit"
            exit 1
          fi

      - name: Check flake
        run: nix flake check --no-build

      - name: Build with Nix
        run:
          nix build
          # Note: requires SSH deploy key for go-finding private repo
          # Configure in Settings > Secrets > SSH_DEPLOY_KEY

      - name: Verify binary
        run: ./result/bin/golangci-lint-auto-configure --version

    timeout-minutes: 15
  govulncheck:
    name: Security scan (govulncheck)
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

    timeout-minutes: 15
  summary:
    name: Workflow Summary
    runs-on: ubuntu-latest
    needs: [test-and-build, lint, nix, govulncheck]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## 🎯 Go CI/CD Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Tests (Go version from go.mod)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Race condition detection enabled" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Coverage report uploaded to Codecov" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Quality Checks" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ golangci-lint with comprehensive ruleset" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Build verification" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Module caching for faster builds" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✨ All checks completed successfully!" >> $GITHUB_STEP_SUMMARY
    timeout-minutes: 15
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
