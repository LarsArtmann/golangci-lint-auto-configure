name: Go CI/CD

on:
  push:
    branches: [master, main, develop]
    paths-ignore:
      - "**/*.md"
      - docs/**
      - LICENSE
      - .gitignore
      - "**/*.svg"
      - "**/*.png"
  pull_request:
    branches: [master, main, develop]
    paths-ignore:
      - "**/*.md"
      - docs/**
      - LICENSE
      - .gitignore
      - "**/*.svg"
      - "**/*.png"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
      CGO_ENABLED: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-test-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-test-
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: go mod download

      - name: Install golangci-lint for CLI tests
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          install-only: true

      - name: Build verification
        run: |
          go build -v ./...
          echo "✓ Build successful"

      - name: Deterministic-marshal enforcement
        run: go run github.com/larsartmann/linter-autoconfigure-sdk/cmd/jsondeterminism ./...

      - name: Run tests
        run: go test -v -race ./pkg/... ./internal/... ./cmd/...

      - name: Test with coverage
        run: |
          go test -v -coverprofile=coverage.out -covermode=atomic ./pkg/... ./internal/... ./cmd/coverage-check/
          echo "Coverage per package:"
          go test ./pkg/... ./internal/... -cover 2>&1 | grep coverage:
          echo ""
          echo "Overall coverage:"
          go tool cover -func=coverage.out | grep total | awk '{print "  " $3 " of statements covered"}'

      - name: Coverage threshold gate
        run: go run ./cmd/coverage-check -min=65 -profile=coverage.out

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          file: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true

    timeout-minutes: 15
  e2e-pin-matrix:
    name: E2E Pin Matrix (golangci-lint ${{ matrix.golangci }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        golangci: [v2.10.1, v2.12.0, v2.13.2, v2.14.0]
    env:
      GOEXPERIMENT: jsonv2

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install pinned golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ matrix.golangci }}
          install-only: true

      - name: Run pin-matrix cell
        run: bash scripts/e2e-pin-matrix.sh ${{ matrix.golangci }} v2.12.0

    timeout-minutes: 15
  lint:
    name: Lint with golangci-lint
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-lint-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-lint-
            ${{ runner.os }}-go-

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          args: --config=.golangci.yml --timeout=5m
          working-directory: .
          skip-cache: false
          skip-save-cache: false

      - name: Build verification (lint job)
        run: |
          go build -v ./...
          echo "✓ Build verification successful"

      - name: Dogfood gate (own config is optimal)
        run: |
          go run ./cmd/golangci-lint-auto-configure configure --config .golangci.yml --check
          echo "✓ the tool accepts its own .golangci.yml unchanged"

    timeout-minutes: 15
  schema-verify:
    name: Schema compat gate (injected defaults verify)
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          install-only: true

      - name: Fixture drift guard (regenerate + diff)
        run: |
          go run ./cmd/generate-schema-fixture
          if git diff --exit-code pkg/constants/testdata/schema-fixture/; then
            echo "✓ schema fixture in sync with injected defaults"
          else
            echo "✗ schema fixture is stale — run 'go run ./cmd/generate-schema-fixture' and commit"
            exit 1
          fi

      - name: Generated reference drift guard (linter_settings_generated.go)
        run: |
          # The reference file must stay in lockstep with the committed schema
          # snapshot: a silent rot here means the hand-maintained curated
          # structs in linter_settings.go drift from the schema unnoticed.
          go run ./cmd/generate-settings -schema=pkg/constants/schema/golangci-lint.jsonschema.json -output=pkg/constants/linter_settings_generated.go -schema-version=v2.14.0
          if git diff --exit-code pkg/constants/linter_settings_generated.go; then
            echo "✓ linter_settings_generated.go in sync with the schema"
          else
            echo "✗ linter_settings_generated.go is stale — run 'go run ./cmd/generate-settings -schema=pkg/constants/schema/golangci-lint.jsonschema.json -output=pkg/constants/linter_settings_generated.go -schema-version=v2.14.0' and commit"
            exit 1
          fi

      - name: Verify fixture against golangci-lint schema
        run: |
          cd pkg/constants/testdata/schema-fixture
          golangci-lint config verify
          echo "✓ every injected default is schema-valid"

      - name: Verify example configs against golangci-lint schema
        run: |
          set -euo pipefail
          failures=0
          for f in examples/*.golangci.yml test.golangci.yml; do
            dir=$(dirname "$f")
            base=$(basename "$f")
            if (cd "$dir" && golangci-lint config verify --config="$base" >/dev/null); then
              echo "✓ $f"
            else
              echo "✗ $f fails 'golangci-lint config verify' — fix or the shipped examples teach invalid configs"
              failures=$((failures + 1))
            fi
          done
          exit "$failures"

    timeout-minutes: 10
  nix:
    name: Nix Flake Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41 # main

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@55718cd9ebf1737a061487d5ada21abf31e99a98 # main
        with:
          use-flakehub: false
        continue-on-error: true

      - name: Check flake.lock is up to date
        run: |
          nix flake lock
          if git diff --exit-code flake.lock; then
            echo "✓ flake.lock is up to date"
          else
            echo "✗ flake.lock is stale — run 'nix flake lock' locally and commit"
            exit 1
          fi

      - name: Check flake
        run: nix flake check --no-build

      - name: Build with Nix (vendorHash guard)
        run: |
          # The guard repairs a stale vendorHash.nix (go.mod/go.sum changed
          # without it) and the git diff check turns the repair into a loud
          # failure with exact contributor instructions, instead of an opaque
          # hash-mismatch build error.
          scripts/vendorhash-guard.sh --fix
          if git diff --exit-code vendorHash.nix; then
            echo "✓ vendorHash.nix in sync with go.mod/go.sum"
          else
            echo "✗ vendorHash.nix was stale — run 'scripts/vendorhash-guard.sh --fix' locally and commit"
            exit 1
          fi

      - name: Verify binary
        run: ./result/bin/golangci-lint-auto-configure --version

    timeout-minutes: 15
  govulncheck:
    name: Security scan (govulncheck)
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

    timeout-minutes: 15
  fuzz:
    name: Fuzz smoke (30s per target)
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Run fuzz smoke
        run: bash scripts/fuzz-smoke.sh 30

    timeout-minutes: 15
  summary:
    name: Workflow Summary
    runs-on: ubuntu-latest
    needs: [test-and-build, lint, nix, govulncheck, fuzz]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## 🎯 Go CI/CD Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Tests (Go version from go.mod)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Race condition detection enabled" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Coverage report uploaded to Codecov" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Quality Checks" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ golangci-lint with comprehensive ruleset" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Build verification" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Module caching for faster builds" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✨ All checks completed successfully!" >> $GITHUB_STEP_SUMMARY
    timeout-minutes: 15
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
