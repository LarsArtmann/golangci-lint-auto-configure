version: v2
run:
    timeout: 5m
    go: ""
    build-tags: ""
    modules-download-mode: ""
    allow-parallel-runners: false
    allow-serial-runners: false
    env: []
output:
    formats: []
    print-issued-lines: false
    print-linter-name: false
    sort-results: false
    print-welcome-message: false
linters:
    enable:
        - errcheck
        - govet
        - arangolint
        - asasalint
        - asciicheck
        - bidichk
        - bodyclose
        - canonicalheader
        - containedctx
        - contextcheck
        - copyloopvar
        - cyclop
        - decorder
        - depguard
        - dogsled
        - dupl
        - dupword
        - durationcheck
        - embeddedstructfieldcheck
        - errchkjson
        - errname
        - errorlint
        - exhaustive
        - exhaustruct
        - exptostd
        - forbidigo
        - forcetypeassert
        - funcorder
        - fatcontext
        - funlen
        - ginkgolinter
        - gocheckcompilerdirectives
        - gochecknoglobals
        - gochecknoinits
        - gochecksumtype
        - gocognit
        - goconst
        - gocritic
        - gocyclo
        - godot
        - godox
        - err113
        - goheader
        - mnd
        - gomoddirectives
        - gomodguard
        - goprintffuncname
        - gosec
        - gosmopolitan
        - grouper
        - iface
        - importas
        - inamedparam
        - interfacebloat
        - intrange
        - ireturn
        - lll
        - loggercheck
        - maintidx
        - makezero
        - mirror
        - misspell
        - musttag
        - nakedret
        - nestif
        - nilerr
        - nilnesserr
        - nilnil
        - nlreturn
        - noctx
        - noinlineerr
        - nonamedreturns
        - nosprintfhostport
        - paralleltest
        - perfsprint
        - prealloc
        - predeclared
        - promlinter
        - protogetter
        - reassign
        - recvcheck
        - revive
        - rowserrcheck
        - sloglint
        - sqlclosecheck
        - spancheck
        - tagalign
        - tagliatelle
        - testableexamples
        - testifylint
        - testpackage
        - thelper
        - tparallel
        - unconvert
        - unparam
        - usestdlibvars
        - usetesting
        - varnamelen
        - wastedassign
        - whitespace
        - wrapcheck
        - wsl
        - wsl_v5
        - zerologlint
        - nolintlint
    disable: []
    fast: false
    presets: []
issues:
    exclude: []
    exclude-generated: false
    max-issues-per-linter: 100
    max-same-issues: 0
    new-from-rev: ""
    new-from-patch: ""
    use-default-excludes: false
servers:
    http-headers: {}
